# Production values for go-guess
nameOverride: ""
fullnameOverride: ""

# Public application domain. Every tenant is served from https://<tenant>.<domain>.
domain: guess.urpi.be

# Tenant slugs. Each one gets its own ingress host and TLS SAN.
tenants:
  - nmbs
  - ypto

imagePullSecrets: []

api:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 100
    fsGroup: 100
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 100
  replicaCount: 2
  image:
    repository: batty1039.startdedicated.net:5000/go-guess-api
    tag: "latest"
    pullPolicy: Always
  environment: production
  frontendURL: ""
  tokenTTL: 8h
  maxUploadMB: 10
  service:
    name: api
    type: ClusterIP
    port: 8080
  goLoose:
    enabled: true
    authDomain: auth.urpi.be
    ca:
      existingSecret: ""
      key: ca.crt
      mountPath: /certs/local-ca.crt
    tenants:
      nmbs:
        clientID: ""
        clientSecret: ""
      ypto:
        clientID: ""
        clientSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  podAnnotations: {}
  podLabels: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

web:
  replicaCount: 2
  image:
    repository: batty1039.startdedicated.net:5000/go-guess-web
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    nodePort: null
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - SETGID
        - SETUID
        - NET_BIND_SERVICE
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  path: /
  pathType: Prefix
  tls:
    enabled: true
    existingSecret: ""
    secretName: ""

certManager:
  enabled: true
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  duration: 8760h
  renewBefore: 720h
  caSecretName: ""

secrets:
  jwtSecret: ""
  databaseURL: ""
  rabbitmqURL: ""
  postgresqlPassword: ""
  rabbitmqPassword: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 18-alpine
    pullPolicy: IfNotPresent
  auth:
    username: go_guess
    database: go_guess
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: 4-alpine
    pullPolicy: IfNotPresent
  auth:
    username: go_guess
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}