{{- include "go-guess.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-guess.apiDeploymentName" . }}
  labels:
    {{- include "go-guess.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: {{ .Values.api.strategy.type }}
  selector:
    matchLabels:
      {{- include "go-guess.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "go-guess.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          env:
            - name: APP_ENV
              value: {{ .Values.api.environment | quote }}
            - name: FRONTEND_URL
              value: {{ include "go-guess.frontendURL" . | quote }}
            - name: TOKEN_TTL
              value: {{ .Values.api.tokenTTL | quote }}
            - name: MAX_UPLOAD_MB
              value: {{ .Values.api.maxUploadMB | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-guess.secretName" . }}
                  key: database-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-guess.secretName" . }}
                  key: rabbitmq-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-guess.secretName" . }}
                  key: jwt-secret
            {{- if .Values.api.goLoose.enabled }}
            - name: GO_LOOSE_AUTH_DOMAIN
              value: {{ .Values.api.goLoose.authDomain | quote }}
            - name: GO_LOOSE_APP_DOMAIN
              value: {{ .Values.domain | quote }}
            {{- if .Values.api.goLoose.ca.existingSecret }}
            - name: GO_LOOSE_CA_FILE
              value: {{ .Values.api.goLoose.ca.mountPath | quote }}
            {{- end }}
            {{- range $tenant, $credentials := .Values.api.goLoose.tenants }}
            {{- $envPrefix := printf "GO_LOOSE_%s" (upper $tenant) }}
            {{- $keyPrefix := printf "go-loose-%s" (lower $tenant) }}
            {{- if $credentials.clientID }}
            - name: {{ $envPrefix }}_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-guess.secretName" $ }}
                  key: {{ $keyPrefix }}-client-id
            {{- end }}
            {{- if $credentials.clientSecret }}
            - name: {{ $envPrefix }}_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-guess.secretName" $ }}
                  key: {{ $keyPrefix }}-client-secret
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            {{- if and .Values.api.goLoose.enabled .Values.api.goLoose.ca.existingSecret }}
            - name: go-loose-ca
              mountPath: {{ dir .Values.api.goLoose.ca.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: temporary-files
          emptyDir: {}
        {{- if and .Values.api.goLoose.enabled .Values.api.goLoose.ca.existingSecret }}
        - name: go-loose-ca
          secret:
            secretName: {{ .Values.api.goLoose.ca.existingSecret }}
            items:
              - key: {{ .Values.api.goLoose.ca.key }}
                path: {{ base .Values.api.goLoose.ca.mountPath }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}