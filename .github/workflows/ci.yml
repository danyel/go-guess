name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4 # 👈 Fixed version (v4 is the current stable release)

      - name: Set up Go environment
        uses: actions/setup-go@v5 # 👈 Fixed version (v5 is the current stable release)
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js environment
        uses: actions/setup-node@v4 # 👈 Fixed version (v4 is the current stable release)
        with:
          node-version: 26.x # 👈 Changed to '26.x' for flexible, safe minor patch resolution
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Tests
        run: make test

      - name: Run Linters
        run: make lint

      - name: Run Build Verify
        run: make build
