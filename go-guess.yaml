apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-guess
  labels:
    helm.sh/chart: go-guess-0.1.0
    app.kubernetes.io/name: go-guess
    app.kubernetes.io/instance: go-guess
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: go-guess
      app.kubernetes.io/instance: go-guess
      app.kubernetes.io/component: application
  template:
    metadata:
      annotations:
        checksum/secrets: 35d2fb3ab7972008630bcb7d33a419558d26ded80acf4454d32d2a3fcc82d721
      labels:
        app.kubernetes.io/name: go-guess
        app.kubernetes.io/instance: go-guess
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: go-guess
          image: "batty1039.startdedicated.net:5000/go-guess-api:0.0.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          env:
            - name: APP_ENV
              value: "production"
            - name: FRONTEND_URL
              value: "http://localhost:8080"
            - name: TOKEN_TTL
              value: "8h"
            - name: MAX_UPLOAD_MB
              value: "10"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: go-guess-secrets
                  key: database-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: go-guess-secrets
                  key: rabbitmq-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: go-guess-secrets
                  key: jwt-secret
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}

