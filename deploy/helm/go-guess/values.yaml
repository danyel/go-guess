nameOverride: ""
fullnameOverride: ""

# Public application domain. Every tenant is served from https://<tenant>.<domain>.
domain: guess.urpi.be

# Tenant slugs. Each one gets its own ingress host and TLS SAN.
tenants:
  - nmbs
  - ypto

imagePullSecrets: []

api:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 100
    fsGroup: 100
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 100
  replicaCount: 1
  image:
    repository: batty1039.startdedicated.net:5000/go-guess-api
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  environment: development
  # Public base URL used when building invitation and meeting links. Defaults to
  # https://<first tenant>.<domain> when empty.
  frontendURL: ""
  # Origin of the go-bananas runtime supplying the shared styling contract, for
  # example https://themes.urpi.be. Empty keeps this application's own styles, so
  # a deployment without a theme service is unaffected. The service must also be
  # configured to allow this application's origin, or the browser will refuse to
  # load the controls from it.
  themeBaseUrl: ""
  tokenTTL: 8h
  maxUploadMB: 10
  service:
    # The web image proxies /api/ to the literal upstream name "api:8080", so this
    # Service name has to stay "api" unless the web image is rebuilt.
    name: api
    type: ClusterIP
    port: 8080
  goLoose:
    enabled: true
    authDomain: auth.urpi.be
    ca:
      # Mount an internal CA bundle and point GO_LOOSE_CA_FILE at it.
      existingSecret: ""
      key: ca.crt
      mountPath: /certs/local-ca.crt
    # Per-tenant browser authentication credentials, written to the release secret.
    tenants:
      nmbs:
        clientID: ""
        clientSecret: ""
      ypto:
        clientID: ""
        clientSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  strategy:
    type: Recreate

web:
  replicaCount: 2
  image:
    repository: batty1039.startdedicated.net:5000/go-guess-web
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    nodePort: null
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 300m
      memory: 128Mi
  podAnnotations: {}
  podLabels: {}
  # nginx workers run as uid 101, which the image already declares.
  podSecurityContext: {}
  # nginx binds the privileged port 80 and forks workers as the nginx user, so it
  # needs the root user plus a small capability set and writable scratch paths.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - SETGID
        - SETUID
        - NET_BIND_SERVICE
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  path: /
  pathType: Prefix
  tls:
    enabled: true
    # Use a certificate you already manage instead of the chart-issued one.
    existingSecret: ""
    # Defaults to <fullname>-web-tls when empty and certManager.enabled is true.
    secretName: ""

certManager:
  # Requires cert-manager in the cluster: make cert-manager-install.
  enabled: true
  # Reuse an existing cert-manager issuer instead of creating a self-signed one.
  issuerRef: {}
  duration: 8760h
  renewBefore: 720h
  caSecretName: ""

secrets:
  jwtSecret: ""
  databaseURL: ""
  rabbitmqURL: ""
  postgresqlPassword: ""
  rabbitmqPassword: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 18-alpine
    pullPolicy: IfNotPresent
  auth:
    username: go_guess
    database: go_guess
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: 4-alpine
    pullPolicy: IfNotPresent
  auth:
    username: go_guess
  persistence:
    enabled: true
    size: 4Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}