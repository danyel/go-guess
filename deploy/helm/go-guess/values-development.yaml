# Development profile: demo fixtures, ephemeral database and broker storage, and
# `latest` image tags. Browser sign-in goes through the development identity
# domain auth-dev.urpi.be, never the production auth.urpi.be.
domain: guess-dev.urpi.be

tenants:
  - nmbs
  - ypto

api:
  environment: development
  image:
    tag: latest
    pullPolicy: Always
  goLoose:
    enabled: true
    authDomain: auth-dev.urpi.be
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

web:
  replicaCount: 1
  image:
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 96Mi

ingress:
  enabled: true

postgresql:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

rabbitmq:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi