# Production profile: production fixtures, persistent volumes, released image
# tags, and self-signed certificates served for https://<tenant>.guess.urpi.be.
domain: guess.urpi.be

tenants:
  - nmbs
  - ypto

api:
  environment: production
  image:
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  goLoose:
    enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

web:
  replicaCount: 2
  image:
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx

certManager:
  enabled: true

postgresql:
  persistence:
    enabled: true
    size: 20Gi

rabbitmq:
  persistence:
    enabled: true
    size: 8Gi