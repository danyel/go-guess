# Source: go-guess/templates/rabbitmq-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: go-guess-rabbitmq
  labels:
    helm.sh/chart: go-guess-0.1.0
    app.kubernetes.io/name: go-guess
    app.kubernetes.io/instance: go-guess
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: go-guess-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-guess
      app.kubernetes.io/instance: go-guess
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-guess
        app.kubernetes.io/instance: go-guess
        app.kubernetes.io/component: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rabbitmq
          image: "rabbitmq:4-alpine"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 100
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "go_guess"
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: go-guess-secrets
                  key: rabbitmq-password
          ports:
            - name: amqp
              containerPort: 5672
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
