apiVersion: v1
kind: Service
metadata:
  # Kept as the literal name "api": the web image proxies /api/ to api:8080.
  name: {{ include "go-guess.apiServiceName" . }}
  labels:
    {{- include "go-guess.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "go-guess.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP